<style>

@keyframes fp{0%{transform:translate(0,0);opacity:0}8%{opacity:1}45%{transform:translate(calc(var(--dx)*.3),calc(var(--rh)*-.5))}100%{transform:translate(calc(var(--dx)*.4),calc(var(--rh)*-.62));opacity:1}}

.grp{position:absolute;display:flex;align-items:center;gap:4px;background:#fff;color:#111;border:3px solid #111;border-radius:99px;padding:2px 10px 2px 4px;box-shadow:0 3px 0 #000;font-weight:1000;font-size:16px;transition:opacity .3s;white-space:nowrap}
