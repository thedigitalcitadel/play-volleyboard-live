<title>Sleep Train: get the app</title>
<!-- Static fallback page for the Sleep Train house ad. No scripts, no tracking. -->
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
